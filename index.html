<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Secret Message</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient background: animated gradient blobs + floating particles (pure CSS/JS, no image assets needed) -->
  <div class="bg-decor" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
  </div>
  <div class="particle-layer" id="particleLayer" aria-hidden="true"></div>

  <main id="app">

    <!-- ===================== SCENE 1 — THE QUESTION ===================== -->
    <section class="scene is-active" id="scene-1" data-scene="1" aria-label="Question">
      <div class="scene-inner">
        <div class="emoji-pop" aria-hidden="true">🥺</div>
        <h1 class="q-heading">Do you have a crush on me?</h1>

        <div class="button-row">
          <button type="button" class="btn btn-yes" id="btnYes">
            Yes
          </button>
          <button type="button" class="btn btn-no" id="btnNo">
            No
          </button>
        </div>

        <p class="hint">go ahead, try to click "no" 😏</p>
      </div>
    </section>

    <!-- ===================== SCENE 2 — LOVE SCREEN ===================== -->
    <section class="scene" id="scene-2" data-scene="2" aria-label="I have a crush on you">
      <div class="scene-inner">
        <h1 class="glow-heading">I HAVE A CRUSH ON YOU</h1>
        <p class="subtitle">just so you know</p>

        <button type="button" class="envelope" id="envelopeBtn" aria-label="Open the secret letter">
          <span class="envelope-shadow"></span>
          <span class="envelope-body">
            <span class="envelope-back"></span>
            <span class="envelope-flap"></span>
            <span class="envelope-seal">
              <span class="seal-half seal-left">♥</span>
              <span class="seal-half seal-right">♥</span>
            </span>
          </span>
          <span class="envelope-label">Open Secret Letter</span>
        </button>
      </div>
    </section>

    <!-- ===================== SCENE 3 — SECRET LETTER ===================== -->
    <section class="scene" id="scene-3" data-scene="3" aria-label="Secret letter">
      <div class="scene-inner">

        <article class="letter-card" id="letterCard">
          <h2 class="letter-title">For You <span aria-hidden="true">❤️</span></h2>
          <p class="letter-line type-line" data-text="I've been smiling a little more since you came around."></p>
          <p class="letter-line type-line" data-text="You're the first thing I think of when something good happens."></p>
          <p class="letter-line type-line" data-text="I don't know where this goes, but I didn't want to keep it a secret anymore."></p>
          <p class="letter-line letter-line-final">I have a crush on you. There, I said it.</p>

          <button type="button" class="btn btn-yes" id="closeLetterBtn">Close Letter</button>
        </article>

        <div class="thank-you" id="thankYou" hidden>
          <p>Thank you for opening my secret message <span aria-hidden="true">❤️</span></p>
        </div>

      </div>
    </section>

  </main>

  <!-- Full-screen overlay layers for effects, kept outside scenes so they can render above everything -->
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
  <div class="burst-layer" id="burstLayer" aria-hidden="true"></div>

  <footer class="site-footer">© Boss G. All rights reserved.</footer>

  <script src="script.js"></script>
</body>
</html>
